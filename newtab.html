<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button id="settings-btn" class="settings-btn" aria-label="Settings">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>

  <div id="on-this-day" class="on-this-day"></div>

  <main class="dashboard">
    <section class="clocks">
      <div class="clock-side">
        <div class="clock" data-clock="America/New_York">
          <div class="clock-time"></div>
          <div class="clock-city">New York</div>
        </div>
        <div class="clock" data-clock="America/Los_Angeles">
          <div class="clock-time"></div>
          <div class="clock-city">Los Angeles</div>
        </div>
      </div>
      <div class="clock clock-main" data-clock="local">
        <div class="clock-time"></div>
        <div class="clock-city">Inverness</div>
      </div>
      <div class="clock-side">
        <div class="clock" data-clock="Asia/Tokyo">
          <div class="clock-time"></div>
          <div class="clock-city">Tokyo</div>
        </div>
        <div class="clock" data-clock="Australia/Sydney">
          <div class="clock-time"></div>
          <div class="clock-city">Sydney</div>
        </div>
      </div>
    </section>

    <div id="greeting" class="greeting"></div>

    <form id="search-form" class="search" autocomplete="off">
      <div class="search-field">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C3BAE0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="search-input" type="text" placeholder="Search DuckDuckGo or enter address" autofocus autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="search-suggestions">
      </div>
      <ul id="search-suggestions" class="suggestions" role="listbox" hidden></ul>
    </form>
  </main>

  <footer class="news-ticker">
    <button type="button" id="news-logo" class="news-logo"></button>
    <div class="news-track-wrap">
      <div class="news-track" id="news-track">Loading headlines&hellip;</div>
    </div>
  </footer>

  <dialog id="settings-dialog">
    <form id="settings-form" method="dialog">
      <div class="dialog-header">
        <h2>Settings</h2>
        <button type="button" id="settings-close" class="dialog-close" aria-label="Close">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <line x1="4" y1="4" x2="20" y2="20"></line>
            <line x1="20" y1="4" x2="4" y2="20"></line>
          </svg>
        </button>
      </div>
      <label>
        Search engine
        <select id="search-engine-select">
          <option value="duckduckgo">DuckDuckGo</option>
          <option value="google">Google</option>
          <option value="bing">Bing</option>
          <option value="ecosia">Ecosia</option>
        </select>
      </label>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button type="button" id="settings-cancel">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <script src="js/newtab.js"></script>
</body>
</html>
